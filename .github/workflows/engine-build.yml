# Compile-checks the embedded C++ engine path (ENGINE_EMBEDDED) against the vendored
# focus-stack + OpenCV sources. Separate from ios-tests.yml so it only runs when the
# app sources, the bridge, or the build inputs actually change — it is the most
# expensive job in the repo (vendors OpenCV, compiles ~30 C++ translation units), so
# docs-only and workflow-only commits skip it.
name: engine build

# MANUAL ONLY, deliberately — this is the repository's most expensive job by a wide
# margin: it vendors OpenCV and compiles ~30 C++ translation units on a macOS runner,
# which bills at ten times a Linux minute.
#
# What it guards is not currently shipping. `ENGINE_EMBEDDED` is commented out in
# project.yml, so the app builds the Swift fallback stacker and this job compile-checks
# a path the app does not include. Running it automatically on every source change —
# which is what it did until CI budget became the binding constraint — spent the most
# money on the least active code.
#
# Run it by hand before enabling the engine, and after any change to the bridge or the
# vendored sources:
#     gh workflow run "engine build"        (or the Run workflow button in Actions)
#
# To restore automatic runs, put back the `push:`/`pull_request:` triggers with paths
# ios/StackShot/{Bridge,Sources}/**, project-engine.yml and scripts/fetch_engine.sh.
# That is the right setting once the engine is switched on and the budget allows.
on:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-engine:
    # Compile-checks the embedded C++ engine path (ENGINE_EMBEDDED) using the
    # standalone project-engine.yml spec. Build-only — no tests — since this
    # job's purpose is to catch breakage in the engine bridge/vendor sources.
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Install tools
        run: brew install xcodegen

      - name: Cache vendored engine + OpenCV
        uses: actions/cache@v4
        with:
          path: ios/StackShot/Vendor
          key: engine-vendor-opencv-4.9.0-v2

      - name: Fetch engine sources
        working-directory: ios/StackShot
        run: scripts/fetch_engine.sh

      - name: Generate Xcode project
        working-directory: ios/StackShot
        run: xcodegen generate --spec project-engine.yml

      - name: Build with engine embedded
        working-directory: ios/StackShot
        # Device destination: opencv2.framework is a classic fat framework whose
        # arm64 slice is a DEVICE slice — an arm64 simulator build would reject it.
        # Build-only needs no signing.
        run: |
          set -o pipefail
          xcodebuild \
            -project StackShotEngine.xcodeproj \
            -scheme StackShot \
            -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build
