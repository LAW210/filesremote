# Compiles the StackShot iOS app and runs its unit tests on macOS
# whenever changes touch the ios/ directory (or this workflow file).
name: iOS build & test

on:
  push:
    paths:
      - "ios/**"
      # Documentation under ios/ cannot change what compiles. A README-only commit
      # used to spend a full macOS build-and-test, which is billed at ten times a
      # Linux minute. Negations are evaluated in order, so this must follow "ios/**".
      - "!ios/**/*.md"
      - ".github/workflows/ios-tests.yml"
  pull_request:
    paths:
      - "ios/**"
      - "!ios/**/*.md"
      - ".github/workflows/ios-tests.yml"

# Only the newest commit on a ref is worth building. Without this, pushing three
# fixes in five minutes ran three full macOS jobs to completion and paid for all
# three, when only the last one's result could still matter. Superseded runs are
# now cancelled the moment they are superseded.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    # macos-15 ships Xcode 16.x, required to open the project format that
    # current xcodegen releases emit (format 77 broke Xcode 15.4 on macos-14).
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install tools
        run: brew install xcodegen swiftlint

      # Warnings annotate the PR; only lint errors fail the job.
      - name: SwiftLint
        working-directory: ios/StackShot
        run: swiftlint lint --reporter github-actions-logging

      - name: Generate Xcode project
        working-directory: ios/StackShot
        run: xcodegen generate

      - name: Build and test
        working-directory: ios/StackShot
        # Pick whatever iPhone simulator this runner image actually provides
        # instead of hardcoding a device name that rotates between images.
        run: |
          set -o pipefail
          DEVICE_ID=$(xcrun simctl list devices available --json | python3 -c "
          import json, sys
          data = json.load(sys.stdin)
          devices = [d for devs in data['devices'].values() for d in devs
                     if d.get('isAvailable') and d['name'].startswith('iPhone')]
          print(devices[0]['udid'])
          ")
          echo "Using simulator: $DEVICE_ID"
          xcodebuild \
            -project StackShot.xcodeproj \
            -scheme StackShot \
            -destination "platform=iOS Simulator,id=$DEVICE_ID" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            -resultBundlePath TestResults.xcresult \
            test

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: ios/StackShot/TestResults.xcresult
          retention-days: 14
