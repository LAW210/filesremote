# Compiles the StackShot iOS app and runs its unit tests on macOS
# whenever changes touch the ios/ directory (or this workflow file).
name: iOS build & test

on:
  push:
    paths:
      - "ios/**"
      - ".github/workflows/ios-tests.yml"
  pull_request:
    paths:
      - "ios/**"
      - ".github/workflows/ios-tests.yml"

jobs:
  build-and-test:
    runs-on: macos-14
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install xcodegen
        run: brew install xcodegen

      - name: Generate Xcode project
        working-directory: ios/StackShot
        run: xcodegen generate

      - name: Build and test
        working-directory: ios/StackShot
        run: |
          set -o pipefail
          xcodebuild \
            -project StackShot.xcodeproj \
            -scheme StackShot \
            -destination 'platform=iOS Simulator,name=iPhone 15' \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            test
