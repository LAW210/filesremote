# CI-only spec: compile-checks the ENGINE_EMBEDDED path; run scripts/fetch_engine.sh first.
# Standalone XcodeGen spec (not an include-based overlay) — a full copy of the
# StackShot app target from project.yml, modified to compile in the vendored
# focus-stack C++ engine + OpenCV xcframework. Test target and schemes are
# intentionally omitted; xcodegen auto-generates a "StackShot" scheme for the
# lone StackShot target, which the build-engine CI job builds (not tests).
name: StackShotEngine
options:
  bundleIdPrefix: com.lawsecurity
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

targets:
  StackShot:
    type: application
    platform: iOS
    sources:
      - Sources
      - Bridge
      # Exclude the CLI entry point and every GoogleTest-dependent file — gtest is
      # never vendored, and both main.cc and gtest_main.cc define their own main().
      # *.cl is excluded from COMPILATION only: task_wavelet_templates.hh #includes
      # the kernels file as text, so it must not also hit Xcode's OpenCL build rule.
      - path: Vendor/focus-stack/src
        excludes:
          - "main.cc"
          - "gtest_main.cc"
          - "*_tests.cc"
          - "*_test.cc"
          - "gtest*"
          - "*.cl"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.lawsecurity.stackshot
        SWIFT_VERSION: "5.9"
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_OBJC_BRIDGING_HEADER: Bridge/StackShot-Bridging-Header.h
        CLANG_CXX_LANGUAGE_STANDARD: c++17
        IPHONEOS_DEPLOYMENT_TARGET: "17.0"
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: ENGINE_EMBEDDED
        OTHER_CPLUSPLUSFLAGS: "-DENGINE_EMBEDDED=1"
        HEADER_SEARCH_PATHS: "$(SRCROOT)/Vendor/focus-stack/src"
        GCC_PREPROCESSOR_DEFINITIONS: "$(inherited) ENGINE_EMBEDDED=1"
    dependencies:
      # The OpenCV 4.9.0 iOS release ships a classic fat framework (device +
      # simulator slices), not an xcframework.
      - framework: Vendor/opencv2.framework
        embed: false
    info:
      path: Info.plist
      properties:
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        NSCameraUsageDescription: "StackShot uses the camera to capture focus-bracketed photos."
        NSPhotoLibraryAddUsageDescription: "StackShot saves your stacked photos to your library."
